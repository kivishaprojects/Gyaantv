<svg width="230" height="64" viewBox="0 0 230 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gyaan TV">
  <defs>
    <linearGradient id="gt-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD86B"/>
      <stop offset="0.5" stop-color="#F5A31E"/>
      <stop offset="1" stop-color="#E4670B"/>
    </linearGradient>
    <linearGradient id="gt-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="0.6" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FFF3C4"/>
    </linearGradient>
  </defs>
  <!-- emblem -->
  <circle cx="32" cy="32" r="28" fill="url(#gt-gold)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#7A1F12" stroke-opacity="0.18" stroke-width="2"/>
  <!-- lotus base -->
  <g fill="#7A1F12" fill-opacity="0.9">
    <path d="M32 46c-7 0-13-3.5-16-8 4 1.6 7.5 2 10 1.2C24 42 27.5 44 32 44s8-2 6-4.8c2.5.8 6 .4 10-1.2-3 4.5-9 8-16 8z"/>
  </g>
  <!-- diya flame -->
  <path d="M32 12c4.2 5 7 9 7 13.5C39 31 36 34 32 34s-7-3-7-8.5C25 21 27.8 17 32 12z" fill="url(#gt-flame)"/>
  <ellipse cx="32" cy="27" rx="2.6" ry="4" fill="#B23A0E" fill-opacity="0.55"/>
  <!-- wordmark -->
  <text x="70" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#7A1F12" letter-spacing="0.5">Gyaan<tspan fill="#E4670B"> TV</tspan></text>
  <text x="71" y="50" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.2" fill="#B07A1E">DEVOTIONAL OTT</text>
</svg>
